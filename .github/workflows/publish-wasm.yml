name: Publish rudof-wasm (npm)

# Builds rudof_wasm with wasm-pack and publishes @kanzo-tech/rudof-wasm to npm.
# Trigger: a `rudof-wasm-v*` tag (version derived from the tag) or manual dispatch.
# Requires an NPM_TOKEN repository secret (npm automation token with publish rights
# on the @kanzo-tech scope).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish (e.g. 0.3.4)"
        required: true
  push:
    tags:
      - "rudof-wasm-v*"

jobs:
  publish:
    name: Build & publish @kanzo-tech/rudof-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing (no long-lived NPM_TOKEN needed).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#rudof-wasm-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Build with wasm-bindgen-cli (NOT wasm-pack, which is archived). The CLI
      # version MUST match the `wasm-bindgen = "=0.2.120"` lib pin, or the module
      # is ABI-mismatched and fails at instantiation.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.120

      # wasm-opt comes from the binaryen RELEASE, not from install-action, which
      # carries no manifest for it (nor for binaryen) at any version: asking it
      # for `wasm-opt@116` falls back to cargo-binstall, which resolves the Rust
      # *crate* named wasm-opt — versioned 0.x, so `=116` matches nothing and the
      # job dies with exit 76. Distro packages are not an option either: apt ships
      # binaryen 108, which corrupts the externref table.
      #
      # build.sh treats wasm-opt as optional and only skips the -Oz size pass when
      # it is missing, so a silent failure here would publish a ~4.6 MB artefact
      # instead of ~3.0 MB. Hence the checksum check and the explicit --version.
      - name: Install wasm-opt (binaryen)
        env:
          BINARYEN: "116"
        run: |
          set -euo pipefail
          tarball="binaryen-version_${BINARYEN}-x86_64-linux.tar.gz"
          base="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/${tarball}.sha256"
          sha256sum -c "${tarball}.sha256"
          sudo tar xzf "${tarball}" -C /opt
          echo "/opt/binaryen-version_${BINARYEN}/bin" >> "$GITHUB_PATH"
      - name: Verify wasm-opt
        run: wasm-opt --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; ensure the CLI is recent.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Build pkg
        run: PKG_NAME="@kanzo-tech/rudof-wasm" PKG_VERSION="${{ steps.ver.outputs.version }}" bash rudof_wasm/build.sh

      # No NODE_AUTH_TOKEN: auth + provenance come from the OIDC id-token above,
      # via the Trusted Publisher configured for this package on npmjs.com.
      - name: Publish to npm
        run: npm publish --access public
        working-directory: rudof_wasm/pkg
