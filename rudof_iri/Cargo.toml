[package]
name = "rudof_iri"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation = "https://docs.rs/rudof_iri"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Dereferencing an `http(s)` IRI (`IriS::dereference`), over a blocking `reqwest`
# client, which brings a tokio runtime with it. Off by default: without it a
# `file:` IRI still dereferences and any other scheme is `FetchNotEnabled`.
# Native only; on wasm the feature compiles to nothing.
fetch = ["dep:reqwest"]

[dependencies]
getrandom.workspace = true
indexmap.workspace = true
oxiri.workspace = true
oxrdf.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
proptest.workspace = true
reqwest = { workspace = true, optional = true, features = ["blocking"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
