[package]
name = "rudof_wasm"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true
readme = "README.md"
description = "wasm-bindgen bindings exposing rudof's SHACL/ShEx stack to JavaScript"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack reads this: run wasm-opt -Oz on the release build so the published
# .wasm stays small (the standard `release` profile + default -O leaves it ~0.8MB
# larger than -Oz). This replaces the old hand-rolled `wasm-release` cargo profile.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']

[dependencies]
wasm-bindgen = "=0.2.120"
# The page's SQL engine answers with a Promise: `validateTable` awaits it.
# Pinned to the releases paired with `wasm-bindgen = "=0.2.120"`.
js-sys = "=0.3.97"
wasm-bindgen-futures = "=0.4.70"
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
# The TypeScript declaration of every DTO, derived from the serde struct it
# describes, so the `.d.ts` cannot drift from what crosses the boundary. `js`
# is the serde-wasm-bindgen flavour the binding marshals with (maps as `Map`).
tsify = { version = "0.5", default-features = false, features = ["js"] }
console_error_panic_hook = "0.1"

# The binding routes every GRAPH / VALIDATE / PROJECT / SERIALIZE operation
# through rudof's façade — it depends on `rudof_lib` alone (the wasm-capable
# `rudof_lib::form` surface) plus the wasm-bindgen/serde glue. The façade pulls
# in the wasm-clean SHACL/RDF stack (shacl without the `sparql` feature, which
# runs the native engine) so the binding no longer reaches into those internals.
rudof_lib = { path = "../rudof_lib" }

[dev-dependencies]
# The crate compiles only for wasm32 (`rudof_lib::form` is gated to that family),
# so its tests run under wasm-bindgen-test — which CI's `wasm-test` job already
# invokes: `cargo test -p rudof_wasm --target wasm32-unknown-unknown`. Pinned to
# the release paired with the `wasm-bindgen = "=0.2.120"` pin above; the two share
# `wasm-bindgen-test-shared`, so a floating "0.3" would resolve to a newer pair
# that cannot link against 0.2.120.
wasm-bindgen-test = "=0.3.70"
