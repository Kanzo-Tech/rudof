[package]
name = 'shacl'
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/shacl"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# The SQL engine (`validator::sql`): SHACL Core run as SQL over a triples
# relation. Wasm-clean; off by default so that a plain SHACL build
# does not pull the SQL AST.
sql = ["dep:sqlparser"]
# An in-process DuckDB engine for the SQL interpretation: `DuckDbEngine`. Native
# only, never default.
duckdb = ["sql", "dep:duckdb"]

[dependencies]
itertools.workspace = true
oxrdf.workspace = true
rudof_iri.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rudof_rdf.workspace = true
serde.workspace = true
sqlparser = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
duckdb = { workspace = true, optional = true }

[dev-dependencies]
# The SQL interpretation runs on DuckDB in the tests, natively.
shacl = { path = ".", features = ["duckdb"] }
oxrdf = { workspace = true, features = [ "oxsdatatypes" ] }
serde_json.workspace = true
# The W3C suites are embedded in the test binary, so they run on wasm32 too.
include_dir.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The endpoint example reads Wikidata through `OxigraphEndpoint`.
anyhow.workspace = true
rudof_rdf = { workspace = true, features = ["sparql"] }
# The W3C suites' differential test draws its graphs, natively.
proptest.workspace = true
# Drives `sql::validate`, which is async, over the synchronous DuckDB engine.
futures.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
# Pinned with rudof_wasm's, to the release paired with `wasm-bindgen = "=0.2.120"`.
wasm-bindgen-test = "=0.3.70"
