[package]
name = 'shacl'
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/shacl"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["sparql"]
sparql = ["sparql_service/sparql", "rudof_rdf/sparql" ]
# An in-process DuckDB host for the SQL engine: `DuckDbExecutor` and
# `ShaclValidationMode::Sql` in the processors. Native only, never default.
duckdb = ["dep:duckdb"]

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
indoc.workspace = true
itertools.workspace = true
oxrdf.workspace = true
rudof_iri.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rudof_rdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sparql_service.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

# rayon needs OS threads; keep it out of the wasm build (validation runs
# sequentially there — see validator/processor).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon.workspace = true
duckdb = { workspace = true, optional = true }

[dev-dependencies]
# The W3C suite runs every fixture through the SQL engine as well, on DuckDB.
shacl = { path = ".", features = ["duckdb"] }
oxrdf = { workspace = true, features = [ "oxsdatatypes" ] }
serde_json.workspace = true
