[package]
name = 'shacl'
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/shacl"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# The SQL engine (`validator::sql`): SHACL Core compiled to SQL over a
# relational mapping. Wasm-clean; off by default so that a plain SHACL build
# does not pull the SQL AST.
sql = ["dep:sqlparser"]
# An in-process DuckDB host for the SQL engine: `DuckDbExecutor` and
# `validate_with_duckdb`. Native only, never default.
duckdb = ["sql", "dep:duckdb"]

[dependencies]
itertools.workspace = true
oxrdf.workspace = true
rudof_iri.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rudof_rdf.workspace = true
serde.workspace = true
sqlparser = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
duckdb = { workspace = true, optional = true }

[dev-dependencies]
# The W3C suite runs every fixture through the SQL engine as well, on DuckDB.
shacl = { path = ".", features = ["duckdb"] }
oxrdf = { workspace = true, features = [ "oxsdatatypes" ] }
serde_json.workspace = true
# The endpoint example reads Wikidata through `OxigraphEndpoint`.
anyhow.workspace = true
rudof_rdf = { workspace = true, features = ["sparql"] }
